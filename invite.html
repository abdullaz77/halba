<style>body{font-family:-apple-system,'Geeza Pro',sans-serif;background:radial-gradient(120% 80% at 50% 0%,#232a45,#07080d);color:#fff;text-align:center;min-height:100vh;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}

<script>
var c=(new URLSearchParams(location.search).get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);
